name: Database tests

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/database.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/database.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y postgresql-client
      - run: supabase/tests/run_tests.sh
